<style>
/* VOICE serious, warm, guided: a calm companion that always says what to do next
   IDEA a night road you walk once: a camera travels along the hand-drawn map from station to station, one step per screen
   PICTURE the map itself, framed close on the current station, with live effects (eye feeding the brain, pressure, waves, gates)
   COLOUR night ground that changes per chapter; one yellow action button everywhere; cyan imagination, mint gates, coral harm
   TYPE Cairo 800 for titles + IBM Plex Sans Arabic for text
   LAYOUT phone: header, picture, short text, one big button at the bottom. Laptop: picture beside the text, button under the text */
:root{color-scheme:dark;--bg:#0b1216;--ac:#ffd27a;--ink:#f1f5f2;--muted:#a9bcb6;--gold:#ffc94d;--cyan:#36c2d6;--mint:#4ee0a6;--coral:#ff7a7a;--sea:#4aa8e8;--glass:rgba(255,255,255,.05);--edge:rgba(255,255,255,.11)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
#app{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:17px/1.75 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow:hidden;transition:background-color .9s ease;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Cairo","IBM Plex Sans Arabic",sans-serif;font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
button{font-family:inherit}
svg text{font-family:"Cairo","IBM Plex Sans Arabic",sans-serif;font-weight:700}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);max-width:1320px;margin:0 auto}
/* header */
.top{padding:8px 12px 0}
.top .row{display:flex;align-items:center;gap:10px}
.vband{display:none}
.icon{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.where{flex:1;display:flex;align-items:center;gap:8px}
.where b{font:800 17px "Cairo",sans-serif;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .8s}
.where span{margin-inline-start:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.prog{display:flex;gap:5px;padding:8px 0 10px}
.prog i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--ac);border-radius:5px;transition:width .6s ease,background-color .8s}
/* stage */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.visual{position:relative;height:var(--vh,42vh);margin:0 12px;border-radius:24px;overflow:hidden;border:1px solid var(--edge);background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--ac) 13%,transparent),rgba(0,0,0,.28) 78%);transition:height .6s ease}
.visual[data-h=x]{--vh:20vh}.visual[data-h=s]{--vh:27vh}.visual[data-h=n]{--vh:37vh}.visual[data-h=t]{--vh:48vh}
#map{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s ease;pointer-events:none}
.visual.altOn #map{opacity:0}
.alt{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;display:grid;place-items:center;padding:10px}
.alt.on{opacity:1;visibility:visible}
.alt>svg{width:100%;height:100%;max-height:100%}
.banner{position:absolute;inset-inline:0;top:12px;margin:auto;width:max-content;max-width:90%;text-align:center;background:rgba(5,12,15,.86);border:1px solid var(--edge);border-radius:20px;padding:12px 26px;opacity:0;transform:scale(.94);transition:opacity .45s,transform .45s;pointer-events:none;z-index:4}
.banner.on{opacity:1;transform:none}
.banner small{display:block;color:var(--muted);font-size:14px}
.banner b{font:800 22px "Cairo",sans-serif;color:var(--ac)}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.card{overflow-y:auto;padding:14px 18px 20px;overscroll-behavior:contain;scrollbar-width:thin}
.card.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 46px),transparent)}
.card h1{font-size:clamp(28px,5vw,40px)}
.card h2{font-size:clamp(24px,4vw,32px);color:var(--ac);margin-bottom:6px;transition:color .8s}
.card :where(p:not(.q)){margin:0}
.card>p+*,.card>*+p{margin-top:14px}
.kicker{color:var(--muted);font-size:14px;margin:0 0 4px!important}
.call{border-inline-start:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:12px;padding:10px 14px;margin:10px 0 0;font-weight:500}
.call.mint{border-color:var(--mint);background:rgba(78,224,166,.1)}
.call.warn{border-color:var(--coral);background:rgba(255,122,122,.1)}
.how{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.how li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;font-size:16px}
.how i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1d1503;font:800 16px "Cairo",sans-serif}
.priv{font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--mint);font-weight:700;font-size:16px;padding:8px 0;cursor:pointer;text-decoration:underline}
.pick2{display:grid;gap:10px;margin-top:12px}
.pick2 button{min-height:64px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:800 20px "Cairo",sans-serif;cursor:pointer;transition:.25s}
.pick2 button.on{background:var(--ac);color:#111;border-color:var(--ac)}
/* questions */
.ask{margin-top:10px}
.ask .lab{font:800 13px "Cairo",sans-serif;color:var(--ac);margin:0 0 2px}
.ask .q{font-weight:700;font-size:18px;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opts button{text-align:start;font:500 16px/1.6 "IBM Plex Sans Arabic",sans-serif;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);cursor:pointer;transition:.2s}
.opts.wait button{animation:nudge 2.4s ease-in-out 1}
@keyframes nudge{20%{border-color:rgba(255,201,77,.7)}40%{border-color:var(--edge)}}
.opts button.ok{border-color:var(--mint);background:rgba(78,224,166,.15)}
.opts button.no{border-color:var(--coral);background:rgba(255,122,122,.12)}
.fb{margin-top:10px;border-radius:14px;padding:10px 14px;font-size:16px}
.fb.ok{background:rgba(78,224,166,.1);border-inline-start:4px solid var(--mint)}
.fb.no{background:rgba(255,122,122,.1);border-inline-start:4px solid var(--coral)}
.fb b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{min-height:42px;padding:6px 14px;border-radius:99px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:600 15px "IBM Plex Sans Arabic",sans-serif;cursor:pointer;transition:.2s}
.chips button[aria-pressed=true]{background:var(--ac);color:#111;border-color:var(--ac)}
.chips.up button{border-color:rgba(255,201,77,.5)}
.chips.down button{border-color:rgba(78,224,166,.5)}
.chips button:active{transform:scale(.95)}
.grpT{font:800 14px "Cairo",sans-serif;margin:12px 0 0}
/* pressure meter */
.meter{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0 4px}
.meter span{height:10px;border-radius:6px;background:rgba(255,255,255,.12);transition:background-color .35s}
.mlab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:12px;color:var(--muted);text-align:center}
.zone{margin-top:8px;min-height:3.4em}
.legend{position:absolute;bottom:10px;inset-inline-end:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:7px;background:rgba(5,12,15,.8);border:1px solid var(--edge);border-radius:99px;padding:3px 11px 3px 8px;font-size:12.5px;font-weight:700;line-height:1.5;color:var(--ink);opacity:0;transform:translateY(5px);transition:opacity .4s,transform .4s}
.legend span.on{opacity:1;transform:none}
.legend svg{width:20px;height:20px;flex:none}
.thought{--c:#36c2d6;position:relative;border-radius:22px;padding:11px 16px 14px;background:color-mix(in srgb,var(--c) 9%,#0d171b);border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);transition:border-color .4s,background-color .4s}
.thought::before,.thought::after{content:"";position:absolute;border-radius:50%;background:inherit;border:inherit}
.thought::before{width:14px;height:14px;top:-11px;inset-inline-start:34px}
.thought::after{width:8px;height:8px;top:-21px;inset-inline-start:27px}
.thought .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thought .who{font-size:13.5px;color:var(--muted)}
.thought .st{font:800 13px/1.7 "Cairo",sans-serif;color:#081013;background:var(--c);border-radius:99px;padding:0 11px;transition:background-color .4s}
.thought .say{display:block;font:800 20px/1.6 "Cairo",sans-serif;color:#fff;margin:4px 0 2px}
.thought .ex{display:block;font-size:15.5px;line-height:1.7}
.thought .ex:empty{display:none}
.card>.thought{margin-top:22px}
.thought .tbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.lcard{--c:#8ee8f4;margin-top:12px;border-radius:18px;padding:10px 16px 13px;background:color-mix(in srgb,var(--c) 8%,#0d171b);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);transition:border-color .4s,background-color .4s}
.lcard .st{display:inline-block;font:800 13px/1.7 "Cairo",sans-serif;color:#081013;background:var(--c);border-radius:99px;padding:0 11px;transition:background-color .4s}
.lcard .lmain{display:block;font:700 17px/1.7 "Cairo",sans-serif;color:#fff;margin-top:6px}
.lcard .lvoice{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.16);font-size:15px;color:var(--muted)}
.lcard .lvoice b{color:#fff;font-weight:800}
.lcard .lvoice:empty{display:none}
.thought .tbar span{height:6px;border-radius:3px;background:rgba(255,255,255,.1);transition:background-color .3s}
.zone b{display:block;font:800 22px/1.9 "Cairo",sans-serif;padding-bottom:4px;overflow:visible}
.status{margin-top:8px;border-radius:14px;padding:10px 14px;background:rgba(0,0,0,.25);border:1px solid var(--edge);min-height:3.6em}
.status b{color:var(--ac)}
/* two paths */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.two button{min-height:52px;border-radius:14px;border:1px solid rgba(255,122,122,.5);background:rgba(255,122,122,.06);color:var(--ink);font:800 17px "Cairo",sans-serif;cursor:pointer}
.two button.on{background:rgba(255,122,122,.22);border-color:var(--coral)}
.paneX{margin-top:8px;border-radius:14px;padding:10px 14px;background:rgba(255,122,122,.08);border:1px solid rgba(255,122,122,.3);font-size:16px;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
/* drops */
.dropsV{position:absolute;inset:0}
.dropGL{position:absolute;inset:0}
.dropGL canvas{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:contain;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.dropFall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:10px 10px 56px}
.dropGL.gl .dropFall{display:none}
.dropFall svg{width:100%;height:auto;max-height:100%}
.dropNames{position:absolute;inset-inline:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:2}
.dropNames button{min-height:42px;border-radius:12px;border:1px solid var(--edge);background:rgba(5,12,15,.8);color:var(--ink);font:800 16px "Cairo",sans-serif;cursor:pointer}
.dropNames button.seen{border-color:rgba(255,255,255,.35)}
.dropNames button.on{background:var(--ac);color:#111;border-color:var(--ac)}
.dinfo h3{font-size:22px;margin:4px 0}
.meters{display:grid;gap:5px;margin:6px 0 8px;font-size:14px}
.meters div{display:grid;grid-template-columns:5em minmax(0,1fr);align-items:center;gap:8px}
.meters i{height:8px;border-radius:8px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.meters i::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--v);border-radius:8px;background:var(--c)}
.rule{font-weight:700;border-top:1px dashed var(--edge);padding-top:8px;margin-top:6px}
/* summary */
.sum{padding-inline-start:20px;margin:6px 0}
.sum li{margin-bottom:6px}
.splitT{display:grid;gap:8px;margin-top:8px}
.splitT div{border-radius:14px;padding:12px 14px}
.splitT .a{background:rgba(54,194,214,.12);border:1px solid rgba(54,194,214,.4)}
.splitT .b{background:rgba(255,122,122,.12);border:1px solid rgba(255,122,122,.4)}
.splitT b{display:block;font:800 17px "Cairo",sans-serif}
/* action bar */
.act{padding:7px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--edge)}
.hint{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13.5px;color:var(--gold);min-height:20px;margin-bottom:5px;font-weight:700}
.hint:empty{display:none}
.hint svg{width:18px;height:18px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.btns{display:flex;gap:10px}
#back{flex:none;width:58px;height:58px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#back:disabled{opacity:.3;cursor:default}
#primary{flex:1;min-height:58px;border-radius:18px;border:2px solid var(--gold);background:var(--gold);color:#1d1503;font:800 19px "Cairo",sans-serif;cursor:pointer;transition:background-color .25s,color .25s,transform .1s}
#primary:active{transform:scale(.98)}
#primary.locked{background:transparent;color:var(--gold);border-style:dashed;cursor:default}
#primary.pulse{animation:pulse 1.7s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,201,77,.6)}70%{box-shadow:0 0 0 14px rgba(255,201,77,0)}100%{box-shadow:0 0 0 0 rgba(255,201,77,0)}}
/* map */
#map text{paint-order:stroke;stroke:#061014;stroke-width:5px;stroke-linejoin:round}
#map .el{opacity:0;transition:opacity .8s ease}
#map .el.on{opacity:1}
#map.ghost .el.on{opacity:.55}
#map.focusing .el.on{opacity:.26}
#map.focusing .el.on.f{opacity:1}
#map .badge{transform-box:fill-box;transform-origin:center}
#map .el.on .badge{animation:gp 2.2s ease-in-out infinite}
@keyframes gp{50%{transform:scale(1.16)}}
#map .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .6s ease}
#map.shut .lid{transform:scaleY(1)}
#map .flow{transition:opacity .5s}
#map .eyeO,#map .eyeC{transition:opacity .6s ease}
#map .eyeC{opacity:0}
#map.shut .eyeO{opacity:0}
#map.shut .eyeC{opacity:1}
#map.shut .flow{opacity:0}
#map .bgl,#map .pgl,#map #staticG{transition:opacity .5s}
#map .tb{opacity:0;transform:scale(.15);transform-box:fill-box;transform-origin:center;transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
#map .tb.on{opacity:1;transform:none}
#map.sh1 .brainG{animation:shake .18s linear infinite}
#map.sh2 .brainG{animation:shake .09s linear infinite}
@keyframes shake{25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1.5px,1px)}75%{transform:translate(1px,1.5px)}}
#map .wmk{transition:opacity .4s}
#map .oA,#map .oB{transition:opacity .6s}
#map.oStage .oA,#map.oStage .oB{opacity:0}
#map.oStage.o1 .oA,#map.oStage.o2 .oB{opacity:1}
#map.stFlick #stBody,.fflick{animation:flick 2.3s steps(1,end) infinite}
@keyframes flick{0%{opacity:1}11%{opacity:.6}13%{opacity:1}46%{opacity:.8}48%{opacity:1}71%{opacity:.5}73%{opacity:1}}
/* menu */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.3s;z-index:20}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:88%;overflow:auto;z-index:21;background:#0d171b;border-top:1px solid var(--edge);border-radius:24px 24px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet h3{font-size:20px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--edge)}
.seg button{min-height:38px;padding:4px 14px;border-radius:99px;border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.seg button[aria-checked=true]{background:var(--gold);color:#1d1503}
.sw{width:56px;height:32px;border-radius:99px;border:1px solid var(--edge);background:rgba(255,255,255,.1);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .25s}
.sw[aria-checked=true]{background:var(--mint)}
.sw[aria-checked=true]::after{inset-inline-start:27px}
.chT{font:800 14px "Cairo",sans-serif;color:var(--muted);margin:14px 0 6px}
.stL{display:grid;gap:6px}
.stL button{display:flex;align-items:center;gap:10px;text-align:start;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font-size:15px;cursor:pointer}
.stL button .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.stL button.seen .d{background:var(--mint)}
.stL button.cur{border-color:var(--gold)}
.stL button.cur .d{background:var(--gold)}
.stL button:disabled{opacity:.4;cursor:default}
.restart{margin-top:14px;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--edge);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
/* presenter */
body.pm .card h2{font-size:clamp(32px,4vw,52px)}
body.pm .card p,body.pm .sum,body.pm .call{font-size:clamp(19px,2vw,26px)}
body.pm .ask .q{font-size:clamp(22px,2.3vw,30px)}
body.pm .opts button{font-size:clamp(18px,1.9vw,24px)}
body.pm #primary{font-size:22px}
/* spacing rhythm */
.card>*{margin-top:0;margin-bottom:0}
.card>*+*{margin-top:14px}
.card>h1+*,.card>h2+*,.card>.kicker+*{margin-top:8px}
.card>.meter+.mlab{margin-top:4px}
.card>.mlab+.zone{margin-top:10px}
#panes:empty{display:none}
#panes{display:grid;gap:10px}
.paneX{margin-top:0}
.ask .opts+.fbx:not(:empty){margin-top:10px}
.fb{margin-top:0}
.card{padding-bottom:28px}
.call,.status,.paneX,.splitT div{line-height:1.7}
.splitT{gap:10px}
.how{gap:10px}
.chips{gap:8px 8px}
.grpT+.chips{margin-top:8px}
.card>.grpT{margin-top:18px}
.card>.grpT+.chips{margin-top:8px}
.dinfo>*+*{margin-top:8px}
@media (max-width:599px),(max-width:899px) and (orientation:portrait){
html,body{height:auto;overflow:visible}
html{overflow-x:hidden}
#app{display:block;height:auto;overflow:visible}
body{overflow-x:clip;font-size:16.5px;line-height:1.72}
body.lock{overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:12;background:var(--bg);padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));transition:background-color .9s ease}
.icon{width:42px;height:42px;border-radius:12px}
.where b{font-size:16px}
.where span{font-size:13px}
.prog{padding:7px 0 8px}
.prog i{height:4px}
.stage{display:block}
.vband{display:block;position:fixed;left:0;right:0;top:var(--topH,60px);height:calc(var(--vis,240px) + 16px);z-index:9;pointer-events:none;background:linear-gradient(to bottom,var(--bg) calc(100% - 16px),transparent);transition:background-color .9s ease}
.visual{position:fixed;z-index:10;top:var(--topH,60px);left:10px;right:10px;margin:0;height:var(--vis,240px)!important;transition:none;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--ac) 13%,transparent),rgba(0,0,0,.28) 78%),var(--bg)}
.side{display:block;overflow:hidden;padding-top:calc(var(--topH,60px) + var(--he,240px) + 4px)}
.card{overflow:visible;padding:16px 18px calc(var(--actH,90px) + 26px)}
.card.more{-webkit-mask-image:none;mask-image:none}
.act{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);padding:6px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -18px 22px -6px var(--bg);transition:background-color .9s ease}
#back{width:52px;height:52px;border-radius:16px}
#primary{min-height:52px;border-radius:16px;font-size:18px}
.banner{padding:8px 20px}
.banner b{font-size:19px}
html.snap .visual,html.snap .vband{transition:height .45s cubic-bezier(.2,.7,.2,1)}
html.snap .side{transition:padding-top .45s cubic-bezier(.2,.7,.2,1)}
}
@media (min-width:900px),(min-width:600px) and (orientation:landscape){
.stage{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px;padding:0 16px 16px}
.visual{height:auto!important;margin:0}
.side{border:1px solid var(--edge);border-radius:24px;background:rgba(255,255,255,.025);overflow:hidden}
.card{padding:26px 28px}
.sheet{inset-inline:auto 0;inset-inline-start:0;top:0;bottom:0;width:400px;max-height:none;border-radius:0;border-top:0;border-inline-end:1px solid var(--edge);transform:translateX(105%)}
.sheet.on{transform:none}
}
@media (orientation:landscape) and (max-height:500px) and (min-width:600px){
.top{padding:4px max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.icon{width:38px;height:38px;border-radius:11px}
.where b{font-size:15px}
.prog{padding:5px 0 6px}
.stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}
.card{padding:12px 16px 14px}
.card h2{font-size:22px}
.card h1{font-size:26px}
.act{padding:6px 10px 8px}
.hint{font-size:12.5px;margin-bottom:3px;min-height:16px}
#back{width:44px;height:44px;border-radius:13px}
#primary{min-height:44px;border-radius:13px;font-size:16px}
.banner{padding:6px 16px}.banner b{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.motion{display:none}}
</style>

{id:'fitra',ch:1,only:'o',name:'انتكاس الفطرة',vis:'fitra',h:'n',
